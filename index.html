<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>나고야 3박4일 상세 동선</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fb}iframe{display:block;width:100%;height:100%;border:0;background:#f6f8fb}</style>
</head>
<body>
<iframe id="detail" src="./index-base.html?v=20260817-2325-tokugawa" title="나고야 3박4일 상세 동선"></iframe>
<script>
const frame=document.getElementById('detail');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d||!d.body||d.body.dataset.fixed==='1') return;
  d.body.dataset.fixed='1';

  const replaceText=(a,b)=>{
    const w=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT); const nodes=[];
    while(w.nextNode()) nodes.push(w.currentNode);
    for(const n of nodes){ if(n.nodeValue.includes(a) && !n.nodeValue.includes(b)) n.nodeValue=n.nodeValue.split(a).join(b); }
  };
  replaceText('廣寿司 JR名古屋駅店','KITTE Nagoya (킷테 나고야) 내 초밥집');
  replaceText('투어 복귀 후 초밥','투어 복귀 후 KITTE 안 초밥집에서 저녁 · 식사 고정');
  replaceText('다카야마·시라카와고 → 초밥 → 돈키호테','다카야마·시라카와고 → KITTE Nagoya (킷테 나고야) 내 초밥집 → 돈키호테');
  replaceText('초밥 → 돈키호테 → 숙소','KITTE Nagoya (킷테 나고야) 내 초밥집 → 돈키호테 → 숙소');
  const labels=[
    ['矢場とん','矢場とん (야바톤)'],
    ['Grand Warehouse','Grand Warehouse (그랜드 웨어하우스)'],
    ['Midland Square','Midland Square (미들랜드 스퀘어)'],
    ['JOYLAB','JOYLAB (조이랩)'],
    ['Sky-Boat','Sky-Boat (스카이보트)'],
    ['焼肉ジャック','焼肉ジャック (야키니쿠 잭)'],
    ['돈키호테 栄本店','돈키호테 栄本店 (사카에 본점)']
  ];
  for(const[a,b]of labels) replaceText(a,b);

  // Day 1 점심: 야바톤을 메인으로, 라무치는 대안 후보로 유지한다.
  const day1=[...d.querySelectorAll('.absolute-day')].find(x=>x.querySelector('.absolute-head strong')?.textContent.trim()==='Day 1');
  if(day1){
    const yabaton=[...day1.querySelectorAll('.absolute-slot')].find(x=>x.querySelector('.slot-place strong')?.textContent.includes('矢場とん (야바톤)'));
    const sub=yabaton?.querySelector('.slot-place span');
    if(sub && !sub.textContent.includes('라무치')) sub.textContent += ' · 대안 후보: 黒豚屋 らむちぃ (쿠로부타야 라무치)';
  }
  for(const leg of d.querySelectorAll('.leg')){
    const title=leg.querySelector('strong')?.textContent || '';
    const desc=leg.querySelector('span');
    if(title.includes('矢場とん (야바톤)') && desc && !desc.textContent.includes('라무치')){
      desc.append(' · 대안 후보: 黒豚屋 らむちぃ (쿠로부타야 라무치)');
      break;
    }
  }

  // Day 2 canonical itinerary
  const day2=[...d.querySelectorAll('.absolute-day')].find(x=>x.querySelector('.absolute-head strong')?.textContent.trim()==='Day 2');
  if(day2){
    const head=day2.querySelector('.absolute-head span');
    if(head) head.textContent='모닝 → 이누야마 → 히츠마부시 → 쇼핑·오스 → 사카에 야경·저녁 → 대욕장';
    const box=day2.querySelector('.absolute-slots');
    if(box) box.innerHTML=`
      <div class="absolute-slot"><div class="slot-time">08:20</div><div class="slot-place"><strong>카페 카코 부쵸</strong><span>숙소 출발 · 나고야 모닝</span></div></div>
      <div class="absolute-slot"><div class="slot-time">09:20</div><div class="slot-place"><strong>메이테쓰 나고야역 → 이누야마</strong><span>메이테쓰로 이동</span></div></div>
      <div class="absolute-slot"><div class="slot-time">10:00</div><div class="slot-place"><strong>이누야마성 → 이누야마성 쇼와 골목</strong><span>성 관람 후 성하마을 산책</span></div></div>
      <div class="absolute-slot"><div class="slot-time">12:20</div><div class="slot-place"><strong>아츠타 호라이켄 마츠자카야점</strong><span>히츠마부시 점심</span></div></div>
      <div class="absolute-slot"><div class="slot-time">14:20</div><div class="slot-place"><strong>포켓몬 센터 나고야 → 점프 숍 나고야</strong><span>사카에 쇼핑</span></div></div>
      <div class="absolute-slot"><div class="slot-time">15:30</div><div class="slot-place"><strong>JOYLAB (조이랩) 나고야점 → 오스 상점가 → 오스칸논</strong><span>리쿼샵 후 오스 산책 · 도테야끼 간식</span></div></div>
      <div class="absolute-slot"><div class="slot-time">17:40</div><div class="slot-place"><strong>중부전력 미라이 타워 → 오아시스21 → 선샤인 사카에</strong><span>사카에 야경</span></div></div>
      <div class="absolute-slot"><div class="slot-time">19:20</div><div class="slot-place"><strong>테바사키 무츠미 → 프린세스 거리</strong><span>저녁 · 산책</span></div></div>
      <div class="absolute-slot"><div class="slot-time">20:50</div><div class="slot-place"><strong>Urban Quar Spa & Living (어반쿠아)</strong><span>대욕장</span></div></div>
      <div class="absolute-slot"><div class="slot-time">22:30</div><div class="slot-place"><strong>숙소 2차</strong><span>편의점 안주, 짐 정리, Day 3 준비</span></div></div>`;
  }

  const day2Choice=[...d.querySelectorAll('.choice')].find(x=>x.querySelector('.choice-head h3')?.textContent.trim().startsWith('Day 2:'));
  if(day2Choice){
    const h3=day2Choice.querySelector('.choice-head h3');
    if(h3) h3.textContent='Day 2: 모닝 → 이누야마 → 히츠마부시 → 사카에·오스 → 야경·저녁 → 대욕장';
    const summary=day2Choice.querySelector('.choice-head .summary');
    if(summary) summary.textContent='이누야마 반나절 후 나고야로 돌아와 쇼핑, 오스 산책과 도테야끼, 사카에 야경과 저녁, 대욕장까지 이어갑니다.';
    const legs=day2Choice.querySelector('.legs');
    if(legs) legs.innerHTML=`
      <div class="leg"><div><strong>숙소 → 카페 카코 부쵸 → 메이테쓰 나고야역</strong><span><span class="clock">08:20~09:20</span>모닝 후 이누야마 이동 준비.</span></div><div class="time">약 1시간</div></div>
      <div class="leg"><div><strong>메이테쓰 나고야역 → 이누야마성 → 이누야마성 쇼와 골목</strong><span><span class="clock">09:20~12:10</span>이누야마 이동, 성 관람, 성하마을 산책.</span></div><div class="time">약 3시간</div></div>
      <div class="leg"><div><strong>아츠타 호라이켄 마츠자카야점</strong><span><span class="clock">12:20~14:10</span>나고야 복귀 후 히츠마부시 점심.</span></div><div class="time">이동+식사</div></div>
      <div class="leg"><div><strong>포켓몬 센터 나고야 → 점프 숍 나고야</strong><span><span class="clock">14:20~15:30</span>사카에 쇼핑.</span></div><div class="time">약 1시간</div></div>
      <div class="leg"><div><strong>JOYLAB (조이랩) 나고야점 → 오스 상점가 → 오스칸논</strong><span><span class="clock">15:30~17:20</span>리쿼샵 후 오스 권역 산책. 도테야끼도 간식으로 맛보기.</span></div><div class="time">약 2시간</div></div>
      <div class="leg"><div><strong>중부전력 미라이 타워 → 오아시스21 → 선샤인 사카에</strong><span><span class="clock">17:40~19:10</span>사카에 야경 코스.</span></div><div class="time">약 1시간 30분</div></div>
      <div class="leg"><div><strong>테바사키 무츠미 → 프린세스 거리</strong><span><span class="clock">19:20~20:40</span>저녁 후 거리 산책.</span></div><div class="time">약 1시간 20분</div></div>
      <div class="leg"><div><strong>Urban Quar Spa & Living (어반쿠아) → 숙소</strong><span><span class="clock">20:50~22:30</span>대욕장으로 마무리 후 숙소 복귀.</span></div><div class="time">회복</div></div>`;
  }

  // Day 4: 도쿠가와 미술관을 실제 일정에 포함하고, 산업기술기념관과 혼동하지 않는다.
  const day4=[...d.querySelectorAll('.absolute-day')].find(x=>x.querySelector('.absolute-head strong')?.textContent.trim().startsWith('Day 4'));
  if(day4){
    const title=day4.querySelector('.absolute-head strong');
    const head=day4.querySelector('.absolute-head span');
    if(title) title.textContent='Day 4 · 나고야 시내 → 공항';
    if(head) head.textContent='나고야성 → 도쿠가와 미술관 → 노리타케 → 점심·쇼핑 → 공항';
    const box=day4.querySelector('.absolute-slots');
    if(box) box.innerHTML=`
      <div class="absolute-slot"><div class="slot-time">08:30</div><div class="slot-place"><strong>체크아웃 · 짐 보관</strong><span>나고야역 코인락커/수하물 보관</span></div></div>
      <div class="absolute-slot"><div class="slot-time">09:30</div><div class="slot-place"><strong>나고야성</strong><span>오전 관람</span></div></div>
      <div class="absolute-slot"><div class="slot-time">10:50</div><div class="slot-place"><strong>도쿠가와 미술관</strong><span>Day 4 주요 관람지</span></div></div>
      <div class="absolute-slot"><div class="slot-time">12:20</div><div class="slot-place"><strong>노리타케의 숲</strong><span>도자기·잡화·선물</span></div></div>
      <div class="absolute-slot"><div class="slot-time">13:20</div><div class="slot-place"><strong>사이제리아 → 이온몰 나고야 노리타케 가든</strong><span>점심 후 쇼핑</span></div></div>
      <div class="absolute-slot"><div class="slot-time">15:10</div><div class="slot-place"><strong>나고야역 → 공항 이동</strong><span>짐 회수 후 중부국제공항으로 이동</span></div></div>
      <div class="absolute-slot"><div class="slot-time">17:00</div><div class="slot-place"><strong>중부국제공항 (NGO)</strong><span>20:00 출발 준비</span></div></div>`;
  }

  const day4Detail=[...d.querySelectorAll('.day-detail')].find(x=>x.querySelector('h4')?.textContent.trim().startsWith('Day 4'));
  if(day4Detail){
    const h4=day4Detail.querySelector('h4');
    const ol=day4Detail.querySelector('ol');
    if(h4) h4.textContent='Day 4 나고야 시내 → 공항';
    if(ol) ol.innerHTML=`
      <li><span class="clock">08:30~09:20</span>체크아웃, 나고야역 짐 보관 후 나고야성 이동.</li>
      <li><span class="clock">09:30~10:30</span>나고야성 관람.</li>
      <li><span class="clock">10:50~12:00</span><strong>도쿠가와 미술관</strong> 관람.</li>
      <li><span class="clock">12:20~13:10</span>노리타케의 숲.</li>
      <li><span class="clock">13:20~15:00</span>사이제리아 점심 → 이온몰 나고야 노리타케 가든 쇼핑.</li>
      <li><span class="clock">15:10~17:00</span>나고야역에서 짐 회수 후 중부국제공항으로 이동.</li>
      <li><span class="clock">17:00</span>중부국제공항 도착, 20:00 출발 준비.</li>`;
  }

  if(day2){
    const text=day2.textContent;
    const required=['카페 카코 부쵸','이누야마성','아츠타 호라이켄 마츠자카야점','포켓몬 센터 나고야','점프 숍 나고야','JOYLAB','오스 상점가','오스칸논','중부전력 미라이 타워','오아시스21','선샤인 사카에','테바사키 무츠미','프린세스 거리','Urban Quar Spa & Living','도테야끼'];
    const bad=required.filter(name=>text.split(name).length-1!==1);
    if(bad.length) console.error('Day 2 duplicate/missing check failed:',bad);
  }
  if(day4){
    const text=day4.textContent;
    const required=['나고야성','도쿠가와 미술관','노리타케의 숲','사이제리아','이온몰 나고야 노리타케 가든','중부국제공항'];
    const bad=required.filter(name=>text.split(name).length-1!==1);
    if(bad.length) console.error('Day 4 duplicate/missing check failed:',bad);
  }
});
</script>
</body>
</html>
