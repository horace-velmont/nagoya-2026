<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>나고야 3박4일 상세 동선</title>
  <style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f6f8fb}iframe{display:block;width:100%;height:100%;border:0;background:#f6f8fb}</style>
</head>
<body>
<iframe id="detail" src="./index-base.html?v=20260817-2202" title="나고야 3박4일 상세 동선"></iframe>
<script>
const frame=document.getElementById('detail');
frame.addEventListener('load',()=>{
  const d=frame.contentDocument;
  if(!d||!d.body||d.body.dataset.fixed==='1') return;
  d.body.dataset.fixed='1';

  const exactTextRules=[
    ['廣寿司 JR名古屋駅店','KITTE Nagoya (킷테 나고야) 내 초밥집'],
    ['투어 복귀 후 초밥','투어 복귀 후 KITTE 안 초밥집에서 저녁 · 식사 고정'],
    ['다카야마·시라카와고 → 초밥 → 돈키호테','다카야마·시라카와고 → KITTE Nagoya (킷테 나고야) 내 초밥집 → 돈키호테'],
    ['초밥 → 돈키호테 → 숙소','KITTE Nagoya (킷테 나고야) 내 초밥집 → 돈키호테 → 숙소']
  ];

  const labelRules=[
    ['矢場とん','黒豚屋 らむちぃ (쿠로부타야 라무치)'],
    ['Grand Warehouse','Grand Warehouse (그랜드 웨어하우스)'],
    ['Midland Square','Midland Square (미들랜드 스퀘어)'],
    ['JOYLAB','JOYLAB (조이라보)'],
    ['Sky-Boat','Sky-Boat (스카이보트)'],
    ['焼肉ジャック','焼肉ジャック (야키니쿠 잭)'],
    ['돈키호테 栄本店','돈키호테 栄本店 (사카에 본점)']
  ];

  const walker=d.createTreeWalker(d.body,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);

  for(const node of nodes){
    let t=node.nodeValue;
    for(const [a,b] of exactTextRules){ if(t.includes(a)) t=t.split(a).join(b); }
    for(const [a,b] of labelRules){ if(t.includes(b)) continue; if(t.includes(a)) t=t.split(a).join(b); }
    node.nodeValue=t;
  }

  for(const strong of d.querySelectorAll('strong')){
    const t=strong.textContent.trim();
    if(t==='오스상점가·오스관음'){
      const desc=strong.nextElementSibling;
      if(desc){
        desc.innerHTML='<span class="clock">15:00~16:40</span><strong style="display:inline">오스권역 방문:</strong> 코메효 본점 나고야 → 오스 상점가 → 오스칸논. 주변 상점은 동선상 가까운 곳부터 둘러보고 시간에 따라 조정.';
      }
    }
  }

  for(const slot of d.querySelectorAll('.absolute-slot')){
    const place=slot.querySelector('.slot-place strong');
    if(place && place.textContent.trim()==='오스상점가'){
      const desc=place.nextElementSibling;
      if(desc) desc.textContent='오스권역 · 코메효 본점 나고야 → 오스 상점가 → 오스칸논';
    }
  }
});
</script>
</body>
</html>
